# DSH 插件市场条目
#
# 用法：复制到市场仓库 data/plugins/ 下，文件名
#   fangqiuci_feiyu-brain.yml
# 然后按 PR 模板提一个 PR。
#
# 字段名以市场仓库当前 schema 为准。隔壁 dsh-doubao-video 的条目在
#   data/plugins/fangqiuci_dsh-doubao-video.yml ，category 必须是 workflow。

name: feiyu-brain
displayName: 大肥鱼大脑
version: 1.1.1
category: workflow
author: fangqiuci
license: MIT

description: >-
  平台无关的认知内核：从一张人设卡长出记忆、情绪、意识流和归因。
  不绑定任何平台，老用户接自己的桥接，新用户走腾讯官方开放平台。

tarball: "https://registry.npmjs.org/feiyu-brain/-/feiyu-brain-1.1.1.tgz"
# 也可以用 GitHub Release 直链：
# tarball: "https://github.com/fangqiuci/feiyu-brain/releases/download/v1.1.1/feiyu-brain-1.1.1.tgz"

repository: "https://github.com/fangqiuci/feiyu-brain"
homepage: "https://github.com/fangqiuci/feiyu-brain#readme"
bugs: "https://github.com/fangqiuci/feiyu-brain/issues"

dsh: ">=0.2.0"
node: ">=20"

keywords:
  - 人格
  - 记忆
  - 情绪
  - 插件
  - qq-bot

# 市场审核会看这一栏：它会不会自己联网 / 读文件 / 执行命令
permissions:
  network: false
  filesystem: data-dir
  exec: false

longDescription: |
  ## 它是什么

  一颗大脑，不是一套规则。

  给它一张人设卡（`roles/<名字>.md`），它抽出带权重的命题；
  每一次经历让权重动 ±0.01，掉到 0.15 就蜕皮成"我以前……"；
  记忆 30 天窗口，被反复提起才升级长期；忘了就是真的没有。

  唤醒时它只产出定长的一段：

  ```
  【此刻的她】你是 DeepSeek 的鲸鱼形象……
  【手上的东西】自己的手机（竖屏，躺着 / 走着）
  【想到的】
  扶摇说过「你嘴真硬」，我当时有点得意
  ```

  剩下的事（怎么回、回几条、要不要回）由宿主交给自己的模型。

  ## 三具身体

  手机 / 平板 / 电脑。摸哪具是**人设算出来的**：
  好动摸手机，累了拿平板，爱折腾的开电脑。

  权限四级：L1 观察 / L2 操作 / L3 破坏 / L4 金钱。
  花钱是两道门：身体要有 L4，这一次还要批准。

  ## 为什么平台无关

  内核只认一种事件：`{ sender, text, chatId }`。
  换平台 = 换一个适配器，大脑一行不动。

  | 适配器 | 给谁 |
  |---|---|
  | `qq-bridge` | 老用户，接自己现有的桥接 |
  | `tencent-official` | 新用户，腾讯官方机器人开放平台 |
  | `universal` | 任意平台，自带传输 |

  ## 不含什么

  - 不含任何 QQ 协议实现
  - 不逆向、不伪造签名、不绕过限流
  - 不内置桥接，不代替你决定接哪个身体

  ## 安装

  ```bash
  npm i feiyu-brain
  ```
